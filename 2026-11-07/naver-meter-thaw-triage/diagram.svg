<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-label="수도계량기 동결과 파손 의심 상황을 구분하는 설명 도식"><rect width="720" height="1050" fill="#F1F6FB"/><g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#172D47"><text x="40" y="55" font-size="23">진우의 알뜰생활 · 직접 만든 판단 도식</text><text x="40" y="125" font-size="40" font-weight="700">언 계량기, 상태부터 확인</text><rect x="40" y="175" width="640" height="255" rx="16" fill="#1B4269"/><text x="65" y="225" font-size="30" font-weight="700" fill="white">파손이 의심되나요?</text><text x="65" y="285" font-size="30" fill="white">유리 깨짐 · 지시부 부풀음 · 누수</text><text x="65" y="344" font-size="30" fill="white">직접 분해하거나 가열하지 말고</text><text x="65" y="392" font-size="30" fill="white">관할 수도사업소에 문의하세요.</text><path d="M40 470H680" stroke="#A0B4C9" stroke-width="2" stroke-dasharray="7 7"/><text x="40" y="528" font-size="31" font-weight="700">파손 없이 얼어 있는 경우</text><text x="40" y="590" font-size="31">따뜻한 물수건으로 천천히</text><text x="40" y="642" font-size="30">미지근한 물부터 점차 따뜻하게</text><text x="40" y="696" font-size="28">녹지 않거나 원인이 불확실하면 문의</text><rect x="40" y="746" width="640" height="155" rx="16" fill="#FFE3D8"/><text x="65" y="795" font-size="30" font-weight="700">50℃ 이상 뜨거운 물 · 토치 금지</text><text x="65" y="848" font-size="28">급격한 열은 고장을 일으킬 수 있어요.</text><text x="40" y="960" font-size="27">서울: 120 / 다른 지역: 관할 수도사업소</text><text x="40" y="1012" font-size="21">근거: 서울아리수본부 공개 안내 · 확인 2026.11.07</text></g></svg>