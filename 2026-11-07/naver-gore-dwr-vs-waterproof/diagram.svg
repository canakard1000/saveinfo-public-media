<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-label="발수 처리와 방수막의 역할을 구별하는 개념 단면도"><rect width="720" height="960" fill="#FFF8ED"/><g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#33303C"><text x="40" y="53" font-size="23">진우의 알뜰생활 · 개념 설명 그림</text><text x="40" y="122" font-size="40" font-weight="700">발수 ≠ 방수</text><text x="40" y="170" font-size="28">실제 원단 사진이 아닌 역할 설명이에요.</text><path d="M160 208q-32 43 0 43q32 0 0-43M330 208q-32 43 0 43q32 0 0-43M500 208q-32 43 0 43q32 0 0-43" fill="#4C8BB5"/><rect x="40" y="284" width="640" height="145" rx="10" fill="#BDCFAD"/><text x="65" y="334" font-size="32" font-weight="700">겉감의 발수 처리(DWR)</text><text x="65" y="390" font-size="30">물방울을 맺혀 굴러떨어지게 해요.</text><rect x="40" y="460" width="640" height="145" rx="10" fill="#AD97BA"/><text x="65" y="510" font-size="32" font-weight="700">방수 멤브레인</text><text x="65" y="565" font-size="30">물이 안쪽으로 침투하는 것을 막아요.</text><text x="40" y="681" font-size="31" font-weight="700">겉감 젖음만으로 막 손상 확정 불가</text><text x="40" y="734" font-size="29">안쪽이 젖으면 개별 상태를 확인하세요.</text><path d="M40 776H680" stroke="#C8BCA9" stroke-width="2"/><text x="40" y="824" font-size="28">제품 종류·관리 라벨부터 확인하세요.</text><text x="40" y="870" font-size="26">모든 제품에 같은 관리법을 적용하지 마세요.</text><text x="40" y="927" font-size="20">근거: GORE-TEX 공식 안내 · 확인 2026.11.07 · 제품 진단 아님</text></g></svg>