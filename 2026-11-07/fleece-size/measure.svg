<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">후리스 실측 비교: 가슴 단면, 소매, 총장</title><desc id="desc">자체 제작한 일반 상의 도식. 가슴 단면은 옷을 펼친 가로 너비이며 몸의 가슴둘레가 아니다. 소매와 총장의 측정 시작점은 판매처 안내를 따른다.</desc>
<rect width="900" height="760" rx="24" fill="#f3f5f7"/>
<g font-family="sans-serif" fill="#203c4a">
<text x="45" y="65" font-size="32" font-weight="bold">내 옷과 같은 위치를 재세요</text>
<text x="45" y="110" font-size="25">호칭 90 · S 대신 비교할 세 곳</text>
<path d="M345 195 L400 175 Q450 220 500 175 L555 195 L705 380 L640 435 L565 340 L565 600 L335 600 L335 340 L260 435 L195 380 Z" fill="#c7d9da" stroke="#203c4a" stroke-width="5" stroke-linejoin="round"/>
<path d="M400 175 Q402 238 450 245 Q498 238 500 175 M450 245 L450 600" fill="none" stroke="#6a888e" stroke-width="4"/>
<path d="M355 490 L413 475 L413 550 L355 550 M487 475 L545 490 L545 550 L487 550" fill="none" stroke="#6a888e" stroke-width="3"/>
<path d="M338 349 H562 M338 349 l15 -10 M338 349 l15 10 M562 349 l-15 -10 M562 349 l-15 10" fill="none" stroke="#ac4b29" stroke-width="5"/>
<rect x="352" y="365" width="196" height="48" rx="8" fill="white"/>
<text x="450" y="399" text-anchor="middle" font-size="29" fill="#ac4b29" font-weight="bold">가슴 단면</text>
<path d="M588 205 L733 379 M588 205 l2 21 M588 205 l21 6 M733 379 l-21 -6 M733 379 l-2 -21" fill="none" stroke="#365a96" stroke-width="4"/>
<text x="689" y="254" font-size="29" fill="#365a96" font-weight="bold">소매</text>
<path d="M779 203 V598 M779 203 l-10 16 M779 203 l10 16 M779 598 l-10 -16 M779 598 l10 -16" fill="none" stroke="#6b5885" stroke-width="4"/>
<text x="803" y="415" font-size="29" fill="#6b5885" font-weight="bold">총장</text>
<text x="45" y="662" font-size="26" font-weight="bold">단면 54cm × 2 = 옷 둘레 약 108cm</text>
<text x="45" y="705" font-size="23">몸의 가슴둘레나 착용 가능 사이즈를 뜻하지 않아요.</text>
<text x="45" y="742" font-size="18" fill="#536670">자체 설명 도식 · 실제 상품 아님 · 측정 시작점은 해당 판매처 안내 우선</text>
</g></svg>