<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img"><rect width="720" height="980" fill="#F9FCFE"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" fill="#152B3C"><text x="40" y="48" font-size="22">진우의 알뜰생활 · 출국 순서도</text><text x="40" y="111" font-size="38" font-weight="700">짐을 부치기 전, 세관 확인</text><path d="M74 195V810" stroke="#C0D5E5" stroke-width="7"/><circle cx="74" cy="195" r="27" fill="#254E70"/><text x="65" y="205" font-size="29" font-weight="700" fill="#fff">1</text><text x="123" y="205" font-size="34" font-weight="700">구매할 때</text><text x="123" y="254" font-size="29">세금 포함 결제</text><text x="123" y="298" font-size="29">매장 안내로 환급 수단 등록</text><circle cx="74" cy="375" r="27" fill="#254E70"/><text x="65" y="385" font-size="29" font-weight="700" fill="#fff">2</text><text x="123" y="385" font-size="34" font-weight="700">출국공항에서</text><text x="123" y="434" font-size="29">여권과 면세품 전부 준비</text><text x="123" y="478" font-size="29">짐 위탁 전 확인 절차</text><circle cx="74" cy="735" r="27" fill="#254E70"/><text x="65" y="745" font-size="29" font-weight="700" fill="#fff">3</text><text x="123" y="745" font-size="34" font-weight="700">확인을 마친 뒤</text><text x="123" y="794" font-size="29">수하물 위탁 · 출국</text><text x="123" y="838" font-size="29">실제 환급은 매장/업체에 확인</text><rect x="115" y="510" width="565" height="165" rx="8" fill="#EFF5F8"/><text x="141" y="554" font-size="29" font-weight="700" fill="#1C664A">초록 판정 → 확인 완료</text><text x="141" y="603" font-size="29" font-weight="700" fill="#A42F43">빨강 판정 → 물품 검사</text><text x="141" y="647" font-size="25">검사 대상이면 검사까지 끝내세요.</text><text x="40" y="914" font-size="21">근거: 일본 관광청 · 2026.11.08 확인</text><text x="40" y="947" font-size="21">직접 만든 설명 그림 · 실제 공항 화면 아님</text></g></svg>