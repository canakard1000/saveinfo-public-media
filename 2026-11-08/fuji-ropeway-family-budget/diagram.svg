<svg xmlns="http://www.w3.org/2000/svg" width="720" height="870" viewBox="0 0 720 870" role="img"><rect width="720" height="870" fill="#F7F4FA"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" fill="#152B3C"><text x="45" y="48" font-size="22">진우의 알뜰생활 · 여행 예산 메모</text><text x="45" y="116" font-size="37" font-weight="700">로프웨이 3인 왕복 예산</text><text x="45" y="166" font-size="28">성인 2명 + 초등학생 1명</text><path d="M45 205H675M45 469H675" stroke="#9A92A4" stroke-dasharray="8 8" stroke-width="2"/><text x="55" y="264" font-size="30">성인 1,200엔 × 2명</text><text x="527" y="264" font-size="31">2,400</text><text x="55" y="329" font-size="30">어린이 600엔 × 1명</text><text x="557" y="329" font-size="31">600</text><text x="55" y="417" font-size="34" font-weight="700">왕복 합계</text><text x="428" y="417" font-size="44" font-weight="700">3,000엔</text><text x="55" y="532" font-size="29" font-weight="700">편도권을 두 번 사는 계산</text><text x="55" y="587" font-size="31">(800 × 2 + 400) × 2</text><text x="55" y="643" font-size="38" font-weight="700">= 4,000엔</text><text x="55" y="699" font-size="29">왕복권보다 1,000엔 많아요.</text><text x="45" y="770" font-size="23">계산 예시 · 실제 영수증/방문 후기 아님</text><text x="45" y="809" font-size="21">개인 요금표 2026.11.01 개정 · 확인2026.11.08</text><text x="45" y="842" font-size="21">근거: 후지산 파노라마 로프웨이 공식 요금표</text></g></svg>