<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920"><rect width="720" height="920" fill="#FFFAF6"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" fill="#152B3C"><text x="36" y="45" font-size="22">진우의 알뜰생활 · 수수료 비교</text><text x="36" y="104" font-size="36" font-weight="700">플랫폼 수수료만 비교해요</text><text x="36" y="151" font-size="27">베트남 동(VND) · 전체 운임 아님</text><text x="36" y="216" font-size="30" font-weight="700">Bike 2km 이하</text><text x="414" y="216" font-size="31" font-weight="700">3,000 → 1,000</text><rect x="36" y="233" width="360.0" height="17" fill="#A9AFB7"/><rect x="36" y="261" width="120.0" height="17" fill="#AD422C"/><text x="36" y="340" font-size="30" font-weight="700">Bike 2~6km*</text><text x="414" y="340" font-size="31" font-weight="700">3,000 → 2,000</text><rect x="36" y="357" width="360.0" height="17" fill="#A9AFB7"/><rect x="36" y="385" width="240.0" height="17" fill="#AD422C"/><text x="36" y="464" font-size="30" font-weight="700">Car 3km 이하</text><text x="414" y="464" font-size="31" font-weight="700">5,000 → 3,000</text><rect x="36" y="481" width="600.0" height="17" fill="#A9AFB7"/><rect x="36" y="509" width="360.0" height="17" fill="#AD422C"/><text x="36" y="588" font-size="30" font-weight="700">Car 3~4km*</text><text x="414" y="588" font-size="31" font-weight="700">5,000 → 4,000</text><rect x="36" y="605" width="600.0" height="17" fill="#A9AFB7"/><rect x="36" y="633" width="480.0" height="17" fill="#AD422C"/><text x="36" y="729" font-size="25">*앞 경계 초과~뒤 경계 이하</text><text x="36" y="768" font-size="25">회색: 전 / 주황: 후</text><text x="36" y="813" font-size="26">2026.11.10 12시~2027.02.25</text><text x="36" y="858" font-size="21">Grab Vietnam · 2026.11.08 확인</text><text x="36" y="890" font-size="21">직접 만든 비교 그림 · 실제 앱 화면 아님</text></g></svg>
